<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <title>Document</title>
</head>
<body>
    <div class="wrapper">
        <div class="header">
            <div class="search-bar">
                <form role="search" action="/search" method="get">
                    <input type="search" name="q" placeholder="Search..." />
                    <button type="submit">🔍</button>
                </form>
            </div>
            <div class="bell"></div>
            <div class="user-info">
                <div class="user-profile"></div>
                <div class="username"></div>
            </div>
            <div class="greeter">
                <div class="user-profile"></div>
                <p>Hi there,</p>
                <p>Morgan Oakley (@morgan)</p>
            </div>
            <div class="menu">
                <ul>
                    <li>New</li>
                    <li>Upload</li>
                    <li>Share</li>
                </ul>
            </div>
        </div>
        <div class="sidebar">
            <div class="dashboard-title">
                <div class="logo"></div>
                <div class="title"></div>
            </div>
            <div class="side-menu-1">
                <ul>
                    <li>
                        <span class="icon"></span>
                        <p>Home</p>
                    </li>
                    <li>
                        <span class="icon"></span>
                        <p>Profile</p>
                    </li>
                    <li>
                        <span class="icon"></span>
                        <p>Messages</p>
                    </li>
                    <li>
                        <span class="icon"></span>
                        <p>History</p>
                    </li>
                    <li>
                        <span class="icon"></span>
                        <p>Tasks</p>
                    </li>
                    <li>
                        <span class="icon"></span>
                        <p>Communities</p>
                    </li>
                </ul>
            </div>
            <div class="side-menu-2">
                <ul>
                    <li>
                        <span class="icon"></span>
                        <p>Settings</p>
                    </li>
                    <li>
                        <span class="icon"></span>
                        <p>Support</p>
                    </li>
                    <li>
                        <span class="icon"></span>
                        <p>Privacy</p>
                    </li>
                </ul>
            </div>

        </div>
        <div class="main-content">
            <h2>Your Projects</h2>
            <div class="main-content-grid"></div>
        </div>
        <div class="announcements">
            <h2>Announcements</h2>
            <div class="announcements-grid"></div>
        </div>
        <div class="trending">
            <h2>Trending</h2>
            <div class="trending-grid"></div>
        </div>
    </div>
    
</body>
</html>
